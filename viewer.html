<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Coordinate Spaces Visualization</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #444;
      pointer-events: auto;
      z-index: 100;
    }
    .ui-row {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    label { cursor: pointer; }
    input[type="number"] {
      width: 60px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 2px 5px;
    }
    select {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 2px 5px;
    }
    hr { border-color: #444; }
  </style>
  

  <!-- Modern ES Module Import Map for r186 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
      }
    }
  </script>
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script> -->
</head>
<body>

<div id="ui-panel">
  <h3>Grid params</h3>
  <div class="ui-row">
    Size / subdivisions <input type="number" id="size" value="10" min="1"> <input type="number" id="divisions" value="20" min="1">
  </div>
  <div class="ui-row">
    XY offset: <input type="number" id="xoffset" value="0"> <input type="number" id="yoffset" value="0"> 
  </div>
  <hr>
  <h3>Camera params</h3>
  <div class="ui-row"><label><input type="checkbox" id="ortho" checked> Orthographic</label></div>
  <div class="ui-row"> Near / far: <input type="number" id="near" value="1"> <input type="number" id="far" value="5"> </div>
  <div class="ui-row"> Fov: <input type="number" id="fov" value="60" min="1"> Aspect ratio: <input type="number" id="aspect-ratio" value="1" min="0"> </div>
  <div class="ui-row"> Left / Right (ortho): <input type="number" id="left" value="-2"> <input type="number" id="right" value="2"> </div>
  <hr>
  <h3>Coordinate Spaces</h3>
  <div class="ui-row"><label><input type="checkbox" id="show-object" checked> Object Space</label></div>
  <div class="ui-row"><label><input type="checkbox" id="show-world" checked> World Space</label></div>
  <div class="ui-row"><label><input type="checkbox" id="show-eye"> Eye (View) Space</label></div>
  <div class="ui-row"><label><input type="checkbox" id="show-clip"> Clip Space</label></div>
  <div class="ui-row"><label><input type="checkbox" id="show-ndc"> NDC</label></div>
  <div class="ui-row"><label><input type="checkbox" id="show-window"> Window Space</label> <label>nPixels: <input type="number" id="winW" value="10" min="1"></label> </div>
  
  <hr>
  <h3>Element Visibility</h3>
  <div class="ui-row">
    <label><input type="checkbox" id="show-frustum" checked> Frustum </label>
    <label><input type="checkbox" id="show-camera" checked> Camera</label>
    <label><input type="checkbox" id="show-cube" checked> Object</label>
  </div>
</div>

<script type = "module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { TransformControls } from 'three/addons/controls/TransformControls.js';

  // UI input getters
  function getOffset() {
      const offset = new THREE.Vector2();
      offset.x = parseFloat(document.getElementById('xoffset').value);
      offset.y = parseFloat(document.getElementById('yoffset').value);
      return offset;
  }
  function getSize(){return parseFloat(document.getElementById('size').value);}
  function getDiv(){ return parseFloat(document.getElementById('divisions').value);}
  function getNear(){return parseFloat(document.getElementById('near').value);}
  function getFar(){return parseFloat(document.getElementById('far').value);}
  function getFov(){return parseFloat(document.getElementById('fov').value);}
  function getAR() {return Math.max(0.00001, parseFloat(document.getElementById('aspect-ratio').value) || 0.00001);}
  function getNpix(){return parseFloat(document.getElementById('winW').value);}
  function isOrtho(){return document.getElementById('ortho').checked;}
  function getLeft(){return parseFloat(document.getElementById('left').value);}
  function getRight(){return parseFloat(document.getElementById('right').value);}


  // Free GPU resurces that the material was using
  function disposeMaterial(mat) {
    // Loop through material properties to find and dispose internal textures
    for (const key of Object.keys(mat)) {
      const value = mat[key];
      if (value && typeof value === 'object' && 'isTexture' in value) {
        value.dispose();
      }
    }
    mat.dispose();
  }

  // Free all GPU resources that the object was using
  function remove(obj) {
    obj.traverse((child) => {
      if (child.geometry) child.geometry.dispose();
      if (child.material) disposeMaterial(child.material);
    });

    obj.removeFromParent();
  } 

  // -------------------------------------- INIT CAMERA - SCENE - RENDERER --------------------------------------
  const scene = new THREE.Scene();

  // Setup Orthographic Camera for a top-down 2D perspective view
  const aspect = window.innerWidth / window.innerHeight;
  const frustumSize = 15;
  const camera = new THREE.OrthographicCamera(
    (frustumSize * aspect) / -2,
    (frustumSize * aspect) / 2,
    frustumSize / 2,
    frustumSize / -2,
    0.1,
    1000
  );
  
  // Position camera directly above looking straight down at (0, 0, 0)
  camera.position.set(0, 20, 0);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableRotate = false; // Keep fixed top-down orientation
  controls.enableZoom = true;    // Allow zooming in/out
  controls.enablePan = true;     // Allow panning around the scene
  controls.screenSpacePanning = true;


  // -------------------------------------- INIT CUBE --------------------------------------
  const cubeGeometry = new THREE.BoxGeometry(2, 2, 2);
  const cubeMaterial = new THREE.MeshNormalMaterial();
  const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
  cube.name = "cube";
  cube.translateX(10);
  cube.scale.set(2,1,1);
  scene.add(cube);

  // -------------------------------------- INIT CONE --------------------------------------
  const cameraGeometry = new THREE.ConeGeometry(1,1,10);
  cameraGeometry.rotateX(-Math.PI / 2);
  const cameraMaterial = new THREE.MeshNormalMaterial();
  const cameraMesh = new THREE.Mesh(cameraGeometry, cameraMaterial);
  cameraMesh.name = "cameraCone";
  scene.add(cameraMesh);

  function updateCamera(lookAtPos){
    const cm = scene.getObjectByName("cameraCone");
    cm.lookAt(lookAtPos.x ,0,lookAtPos.z);
    cm.updateMatrixWorld(true);

    const oldCam = scene.getObjectByName("matrixCamera");
    if(oldCam) {
      oldCam.removeFromParent();
      oldCam.dispose();
    }
    
    // THIS CAMERA IS NOT THE ONE USED FOR RENDERING ONLY TO EXTRACT THE VIEW AND PROJECTION MATRICES
    const newCam = isOrtho() ? new THREE.OrthographicCamera(getLeft(),getRight(),10,-10,getNear(),getFar()) : 
     new THREE.PerspectiveCamera(getFov(), getAR(), getNear(), getFar()); // (fov, aspect, near, far)
    newCam.name = "matrixCamera";
    scene.add(newCam);
    newCam.lookAt(lookAtPos.x ,0,lookAtPos.z);
    newCam.updateMatrixWorld();
    newCam.updateProjectionMatrix();
  }

  updateCamera(new THREE.Vector3(10,0,10));

  // -------------------------------------- DEFINE TRANSFORMS --------------------------------------
  const applyPerspDiv = (vec) => {
    // Remember which side of w = 0 the point was on (w < 0 means it ends up behind the camera)
    vec.wSign = Math.sign(vec.w);
    if (vec.w !== 0) {
        vec.x /= vec.w;
        vec.y /= vec.w;
        vec.z /= vec.w;
        vec.w = 1.0;
    }
    return vec;
  };

  // 1 model, 2 world, 3 view, 4 clip, 5 NDC, 6 window
  const applyMat = (vec, space) =>{
    var res = vec.clone();

    // Model to world
    if (space == 1) {
      const cub = scene.getObjectByName("cube");
      cub.updateMatrixWorld(true);
      return res.applyMatrix4(cub.matrixWorld);
    }
    
    // Window to NDC
    if (space > 5) {
      var nPixels = getNpix();
      res.x = (res.x / nPixels) * 2 - 1;
      res.z = res.z * 2 - 1;
    }

    const cam = scene.getObjectByName("matrixCamera");
    if(!cam) return res;
    const viewInverse = cam.matrixWorld.clone();
    const projInverse = cam.projectionMatrix.clone().invert();
  
    // NDC to view
    if (space > 4) res.applyMatrix4(projInverse);
    if (space > 4) res = applyPerspDiv(res);
    if (space == 4) res.applyMatrix4(cam.projectionMatrix);

    // View to world
    if (space > 2) res.applyMatrix4(viewInverse);

    return res;
  }

  // -------------------------------------- GRIDS --------------------------------------
  /**
   * Generates grid line endpoints as Vector4 instances and applies an optional transformation function.
   * @param {Function} [transformFn] - Function of signature (vec4: THREE.Vector4) => THREE.Vector4
   * @returns {THREE.Vector4[]} Array of transformed Vector4 endpoints for line segments.
   */
  // Grid spans [-size, size] (the NDC cube when size = 1); the last line (i = size) is skipped to mark the positive side
  function generateGridPoints(size, offset, space, divisions) {
    // Default to identity function if no transformation is provided
    const points = [];
    const gridValue = (k,off) => parseFloat((-size + off + (2 * size * k) / divisions).toFixed(3));
    for (let k = 0; k < divisions; k++) {
      const ix = gridValue(k,offset.x);
      const iz = gridValue(k,offset.y);
      // Horizontal line endpoints: (-size, 0, i, 1) to (size, 0, i, 1)
      const hStart = new THREE.Vector4(-size+offset.x, 0, iz, 1);
      const hEnd = new THREE.Vector4(size+offset.x, 0, iz, 1);

      // Vertical line endpoints: (i, 0, -size, 1) to (i, 0, size, 1)
      const vStart = new THREE.Vector4(ix, 0, -size+offset.y, 1);
      const vEnd = new THREE.Vector4(ix, 0, size+offset.y, 1);

      // Apply transform function and store results
      points.push(applyMat(hStart,space));
      points.push(applyMat(hEnd,space));
      points.push(applyMat(vStart,space));
      points.push(applyMat(vEnd,space));
    }

    return points;
  }

  /**
   * Blue (Z-aligned) lines are sampled at every grid value instead of only at their two ends, so the piece
   * that crosses w = 0 (the point at infinity) can be left out instead of being drawn straight through the camera.
   * @returns {number[]} Flat xyz positions for LineSegments.
   */
  function generateZLineSegments(size, offset, space, divisions) {
    const positions = [];
    const gridValue = (k,off) => parseFloat((-size + off + (2 * size * k) / divisions).toFixed(3));
    for (let k = 0; k < divisions; k++) {
      const x = gridValue(k,offset.x);
      let prev = null;
      for (let j = 0; j <= divisions; j++) {
        const z = j < divisions ? gridValue(j,offset.y) : size + offset.y;
        const cur = applyMat(new THREE.Vector4(x, 0, z, 1),space);
        // Consecutive samples on opposite sides of w = 0 are on opposite sides of infinity: don't join them
        if (prev && prev.wSign === cur.wSign) {
          positions.push(prev.x, prev.y, prev.z, cur.x, cur.y, cur.z);
        }
        prev = cur;
      }
    }
    return positions;
  }

  // ------------------------------------- LABELS ------------------------------------------
  // Text sprite drawn on top of everything, used to label each grid line with its original (untransformed) value
  function makeLabel(text, color, position, group) {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.font = 'bold 40px sans-serif';
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 128, 32);
    const material = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false });
    const sprite = new THREE.Sprite(material);
    sprite.scale.set(1.6, 0.4, 1);
    sprite.position.set(position.x, position.y, position.z);
    sprite.renderOrder = 1;
    group.add(sprite);
  }

function generateFrustum() {
    const vectors = [];

    // Helper to push transformed coordinates flattened
    const addSegment = (v1, v2) => {
      const p1 = applyMat(v1, 5);
      const p2 = applyMat(v2, 5);
      vectors.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
    };

    // Bottom square (y = -1)
    addSegment(new THREE.Vector4(-1, 0, -1, 1), new THREE.Vector4(1, 0, -1, 1));
    addSegment(new THREE.Vector4(1, 0, -1, 1),  new THREE.Vector4(1, 0, 1, 1));
    addSegment(new THREE.Vector4(1, 0, 1, 1),   new THREE.Vector4(-1, 0, 1, 1));
    addSegment(new THREE.Vector4(-1, 0, 1, 1),  new THREE.Vector4(-1, 0, -1, 1));

    const frustumGeom = new THREE.BufferGeometry();
    frustumGeom.setAttribute('position', new THREE.Float32BufferAttribute(vectors, 3));
    
    const frustumMaterial = new THREE.LineBasicMaterial({ color: 0xffff00 }); // Yellow
    const frustum = new THREE.LineSegments(frustumGeom, frustumMaterial);
    frustum.name = "frustum";
    frustum.translateY(1); // offset so they don't overlap with grids
    return frustum;
  }

  function generateGrid(space, offset, size, divisions){
    const g = new THREE.Group();
    const gridValue = (k,off) => parseFloat((-size + off + (2 * size * k) / divisions).toFixed(3));

    // Retrieve Vector4 points using generateGridPoints
    const vec4Points = generateGridPoints(size,offset,space,divisions);
    
    // Horizontal (X-aligned) lines come from the endpoint pairs; vertical (Z-aligned) lines are sampled separately
    const xPositions = [];
    const zPositions = generateZLineSegments(size,offset,space,divisions);

    for (let i = 0; i < vec4Points.length; i += 4) {
      // Points 0 & 1 of each loop iteration are horizontal lines (along X)
      xPositions.push(
          vec4Points[i].x,     vec4Points[i].y,     vec4Points[i].z,
          vec4Points[i + 1].x, vec4Points[i + 1].y, vec4Points[i + 1].z
      );
    }

    // 1. Red LineSegments for X-aligned lines
    const xGridGeometry = new THREE.BufferGeometry();
    xGridGeometry.setAttribute('position', new THREE.Float32BufferAttribute(xPositions, 3));
    const xGridMaterial = new THREE.LineBasicMaterial({ color: 0xff0000 }); // Red
    const xGridLines = new THREE.LineSegments(xGridGeometry, xGridMaterial);
    g.add(xGridLines);

    // 2. Blue LineSegments for Z-aligned lines
    const zGridGeometry = new THREE.BufferGeometry();
    zGridGeometry.setAttribute('position', new THREE.Float32BufferAttribute(zPositions, 3));
    const zGridMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff }); // Blue
    const zGridLines = new THREE.LineSegments(zGridGeometry, zGridMaterial);
    g.add(zGridLines);

    // Labels show the original (x, z) of the endpoint, drawn where that endpoint ends up after the transform.
    // Red lines are labelled at their +x end, blue lines at their -z end
    for (let i = 0; i < vec4Points.length; i += 4) {
      const vx = gridValue(i/4,offset.x);
      const vz = gridValue(i/4,offset.y)
      makeLabel(`(${size + offset.x}, ${vz})`, '#ff6666', vec4Points[i + 1],g);
      makeLabel(`(${vx}, ${-size + offset.x})`, '#6699ff', vec4Points[i + 2],g);
    }
    g.name = space.toString();

    return g;
  }

  function resetGrid(space,offset,size,divisions){
    const newGrid = generateGrid(space, offset,size,divisions);
    const oldGrid = scene.getObjectByName(space.toString());
    if (oldGrid) {
      newGrid.visible = oldGrid.visible;
      remove(oldGrid);
    }
    scene.add(newGrid);
  }

  function rebuildLines(offset,size,divisions){
    resetGrid(1,offset,size,divisions); //obj space
    resetGrid(2, offset,size,divisions); //world space
    resetGrid(3, offset,size,divisions); //view space
    resetGrid(4, offset,size,divisions); //clip space
    resetGrid(5, offset,size,divisions); //NDC
    resetGrid(6, offset,size,divisions); //window space

    const oldFrustum = scene.getObjectByName("frustum");
    if (oldFrustum) remove(oldFrustum);
    scene.add(generateFrustum());
  }
  
  // Add events for grid definers
  const gridDefiners = ["size","xoffset","yoffset","divisions"];
  gridDefiners.forEach((id) => {
    const input = document.getElementById(id);
    input.addEventListener('input', (e) => {
      rebuildLines(getOffset(),getSize(),getDiv());
    });
  });

  rebuildLines(getOffset(),getSize(),getDiv());

  // Listen directly to user input changes
  document.getElementById('winW').addEventListener('input', (e) => {
    const newWidth = parseFloat(e.target.value);
    if (!isNaN(newWidth) && newWidth > 0) {
      resetGrid(6,getOffset(),getSize(),getDiv());
    }
  });
  
  // Visibility events
  const visibilityMap = {
    'show-object': '1',
    'show-world':  '2',
    'show-eye':    '3',
    'show-clip':   '4',
    'show-ndc':    '5',
    'show-window': '6',
    'show-camera': 'cameraCone',
    'show-frustum': 'frustum',
    'show-cube': 'cube'
  };

  // Listen to all grid visibility toggles
  Object.entries(visibilityMap).forEach(([id, objectName]) => {
    const checkbox = document.getElementById(id);
    checkbox.addEventListener('change', (e) => {
      const obj = scene.getObjectByName(objectName);
      if (obj) obj.visible = e.target.checked;
    });
    checkbox.dispatchEvent(new Event('change'));
  });
  
  const cameraUpdateList = ['near', 'far', 'aspect-ratio', 'fov', 'ortho','left','right'];
  cameraUpdateList.forEach((id) => {
    const element = document.getElementById(id);
    element.addEventListener('input', () => { rebuildCamera(getOffset(), getSize(), getDiv());});
  });

  function rebuildCamera(offset,size,divisions){
    updateCamera(new THREE.Vector3(10,0,10));

    resetGrid(3, offset,size,divisions); //view space
    resetGrid(4, offset,size,divisions); //clip space
    resetGrid(5, offset,size,divisions); //NDC
    resetGrid(6, offset,size,divisions); //window space

    const oldFrustum = scene.getObjectByName("frustum");
    if (oldFrustum) remove(oldFrustum);
    scene.add(generateFrustum());
  }

  // TODO: WIP
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  window.addEventListener('pointerdown', (event) => {

    const tch = scene.getObjectByName("tcHelper");
    if(tch && tch.controls.dragging) return;

    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const cubeObj = scene.getObjectByName("cube");
    const intersects = raycaster.intersectObject(cubeObj, true);

    if (intersects.length > 0) {
      if(tch){
        const tc = tch.controls;
        if(tc.mode == 'translate'){
          tc.setMode('scale');
          tc.showY = false;
        } else if(tc.mode == 'scale'){
          tc.setMode('rotate');
          tc.showX = false;
          tc.showY = true;
          tc.showZ = false;
        } else if(tc.mode == 'rotate'){
          tc.detach();
          tch.removeFromParent();
        }
      }
      else{
        const tc = new TransformControls(camera, renderer.domElement);
        tc.mode = 'translate';
        tc.showY = false;
        tc.attach(cubeObj);
        tc.addEventListener('change', () => {
          updateCamera(cubeObj.position);
          rebuildLines(getOffset(),getSize(),getDiv());}
        );
        const newTch = tc.getHelper();
        newTch.name = "tcHelper";
        scene.add(newTch);
      }
    }
  });


  // ----------- OTHER STUFF ---------------
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  window.onload = function() {
    animate();
  };

  window.addEventListener('resize', () => {
    const newAspect = window.innerWidth / window.innerHeight;
    camera.left = (frustumSize * newAspect) / -2;
    camera.right = (frustumSize * newAspect) / 2;
    camera.top = frustumSize / 2;
    camera.bottom = frustumSize / -2;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
